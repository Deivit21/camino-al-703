<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Camino al 70.3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cuaderno de entrenamiento móvil — cabecera de una línea, 4 pestañas, la tarjeta del día y todo lo demás en filas plegables */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E8EEF1; --ink:#11202B; --muted:#5A6A77; --line:#DCE3E8;
  --accent:#0A7287; --accent-ink:#FFFFFF; --accent-soft:#D6EEF2;
  --run:#D2480F; --bike:#2A62D0; --foot:#23824A; --str:#8A3FB0; --rest:#7D8C98; --race:#B5174F;
  --ok:#23824A; --mod:#B86E00; --bad:#BC2F2F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E4ECF1; --muted:#94A5B2; --line:#25343F;
    --accent:#45B8CC; --accent-ink:#06222A; --accent-soft:#163A44;
    --run:#FF8152; --bike:#7FA8FF; --foot:#5BCB7E; --str:#C894E6; --rest:#8796A2; --race:#F2709B;
    --ok:#5BCB7E; --mod:#F0A93B; --bad:#F07070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E4ECF1; --muted:#94A5B2; --line:#25343F;
  --accent:#45B8CC; --accent-ink:#06222A; --accent-soft:#163A44;
  --run:#FF8152; --bike:#7FA8FF; --foot:#5BCB7E; --str:#C894E6; --rest:#8796A2; --race:#F2709B;
  --ok:#5BCB7E; --mod:#F0A93B; --bad:#F07070;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem;letter-spacing:.01em}
h2{font-size:1.55rem}
h3{font-size:1.25rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Cabecera */
.top{display:flex;flex-direction:column;gap:2px}
.tt{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;padding:4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rest);display:block}
.sync.on i{background:var(--ok)}.sync.local i{background:var(--mod)}
.count{color:var(--muted);font-size:.95rem}
.count b{color:var(--race);font-weight:600}

/* Pestañas: control segmentado */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:4px}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
@media (max-width:420px){.tab{font-size:.84rem}}

/* Cambios */
.chg-out{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.diff{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.diff li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.diff li:first-child{border-top:0}
.diff .old{color:var(--muted);text-decoration:line-through;font-size:.9rem}
.diff .new{font-weight:600}
.diff .new span{display:block;font-weight:400;font-size:.88rem;color:var(--muted)}
.pet{list-style:none;margin:0;padding:0}
.pet li{padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.pet li:first-child{border-top:0}
.pet .pmeta{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok);color:var(--surface)}.pill.bad{background:var(--bad);color:var(--surface)}.pill.wait{background:var(--mod);color:var(--surface)}
.tab{border:0;background:transparent;min-height:42px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.95rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* Secciones */
.stack{display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;flex-direction:column;gap:2px}
.dayhead p{font-size:.95rem}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);cursor:pointer;font-size:inherit;text-align:left;align-self:flex-start}
.dayhead .linkbtn{min-height:36px;font-size:.92rem}
.sect{font-family:var(--f-body);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 -2px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.93rem}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;min-height:44px}
.foot{margin-top:16px;font-size:.85rem;color:var(--muted)}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.shead{display:flex;gap:12px;align-items:center}
.sport{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--surface)}
.sport svg{width:21px;height:21px}
.sport.sm{width:30px;height:30px;border-radius:9px}
.sport.sm svg{width:17px;height:17px}
.s-run{background:var(--run)}.s-bike{background:var(--bike)}.s-foot{background:var(--foot)}.s-str{background:var(--str)}.s-rest{background:var(--rest)}.s-race{background:var(--race)}.s-test{background:var(--accent)}.s-food{background:var(--mod)}.s-week{background:var(--ink);color:var(--bg)}
.stitle{flex:1;min-width:0}
.meta{margin-top:1px;font-size:.88rem;color:var(--muted)}
.k{font-weight:600}
.k-suave{color:var(--ok)}.k-calidad{color:var(--run)}.k-test{color:var(--accent)}.k-carrera{color:var(--race)}.k-partido{color:var(--foot)}.k-descanso{color:var(--rest)}
.summary{margin-top:12px}
.steps{margin:12px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 14px;font-size:.95rem}
.steps li{display:contents}
.steps li span:first-child{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.tips{margin:0;padding-left:18px;font-size:.93rem;color:var(--muted)}
.tips li+li{margin-top:4px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{font-size:.85rem;border:1px solid var(--line);background:var(--sunk);padding:6px 12px;border-radius:999px;cursor:pointer;text-decoration:none;color:var(--ink)}
.lnk:hover{border-color:var(--accent)}
.file{font-family:var(--f-mono);font-size:.8rem}
.alt{font-size:.93rem}

/* Desplegables: una fila con resumen, el detalle dentro */
details>summary{list-style:none;cursor:pointer;position:relative}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";position:absolute;right:6px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-75%) rotate(45deg);transition:transform .15s ease}
details[open]>summary::after{transform:translateY(-25%) rotate(-135deg)}
details.sub{border-top:1px solid var(--line);margin-top:12px}
details.sub>summary{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 30px 6px 0}
.st1{font-weight:600}
.sumv{margin-left:auto;font-size:.88rem;color:var(--muted);font-weight:500;text-align:right}
.subb{padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
details.card>summary{padding-right:28px}

/* Registro */
.hora-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:12px;min-height:56px}
.hora-row label{font-weight:600}
.log{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:500}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="mod"]{background:var(--mod);border-color:var(--mod);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="skip"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.log details.sub{margin-top:12px}
.fields{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.fields label{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
select,input[type=number],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
input[type=number]{width:84px}
textarea{width:100%;min-height:66px;resize:vertical;font-size:.95rem}
.log textarea{margin-bottom:12px}

/* Filas (semana, próximos días, menú) */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;min-width:0}
button.row{cursor:pointer}
.rtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.rtxt b{font-weight:600;line-height:1.3}
.rtxt>span{font-size:.86rem;color:var(--muted)}
.row.quiet{background:transparent;border-style:dashed;color:var(--muted);min-height:48px}
.chev{color:var(--muted);font-size:1.5rem;line-height:1}
details.rowd{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
details.rowd>summary.row{border:0;background:transparent;padding-right:48px}
details.rowd>summary::after{right:18px}
.rbody .seg button{font-size:.84rem;padding-inline:4px}
.rbody .seg button span{display:none}
details.rowd[open]{border-color:var(--accent)}
.rbody{padding:0 14px 14px}
.st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;border:2px solid var(--line);color:transparent}
.st-done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st-mod{background:var(--mod);border-color:var(--mod);color:var(--surface)}
.st-skip{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.wday{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.wdl{text-align:center;padding-top:10px}
.wdl span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wdl b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1}
.wday.is-today .wdl b{color:var(--accent)}
.rsess{display:flex;flex-direction:column;gap:6px;min-width:0}
.rest{margin-top:14px;display:flex;flex-direction:column;gap:12px}

/* Semana */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav button{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-size:1.25rem}
.weeknav button:disabled{opacity:.35;cursor:default}
.weekinfo{flex:1;text-align:center;min-width:0}
.weekinfo p{font-size:.9rem;color:var(--muted)}
.wprog{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.wprog span{font-size:.88rem;color:var(--muted)}

/* Tablas */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.mono{white-space:nowrap}
.z{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* Temporada */
.timeline{display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:14px;position:relative}
.ph::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.ph:last-child::before{display:none}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:2px}
.ph.now .dot{border-color:var(--accent);background:var(--accent)}
.ph.race .dot{border-color:var(--race)}
.ph.past{opacity:.6}

/* Ejercicios */
.ex{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:start}
.fig{background:var(--sunk);border-radius:10px;padding:6px}
.fig svg{display:block;width:100%;height:auto}
.fig .floor{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.fig .b{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .h{fill:var(--ink)}
.fig .hl{stroke:var(--accent);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .t{fill:var(--accent);opacity:.28}
.fig .ar{stroke:var(--run);stroke-width:2.5;fill:none;stroke-linecap:round}
.fig .ah{fill:var(--run)}
.fig .bench{fill:var(--line)}
.fig .wall{stroke:var(--muted);stroke-width:3}
.fig text{font-family:var(--f-body);font-size:9px;fill:var(--muted)}
.dose{font-family:var(--f-mono);font-size:.88rem;color:var(--accent);font-weight:500}
.ex ol{margin:8px 0 0;padding-left:20px;font-size:.95rem}
.ex ol li+li{margin-top:3px}
.exnotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.88rem;padding-bottom:12px}
.exnotes div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.exnotes b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.timer{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.timer button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}
.timer output{font-family:var(--f-display);font-size:1.6rem;font-weight:700;min-width:3ch;color:var(--accent)}

/* Acordeones (comida, guías) */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.g>summary{display:flex;align-items:center;min-height:56px;padding:12px 30px 12px 0;font-weight:600}
details.g .gb{padding-bottom:16px;font-size:.95rem;display:flex;flex-direction:column;gap:10px}
details.g ol,details.g ul{margin:0;padding-left:20px}
details.g li+li{margin-top:4px}
.gb [id$="-out"]{display:flex;flex-direction:column;gap:10px}

/* Comida de hoy */
.fbody{margin-top:6px}
.food .flab{display:block;font-size:.9rem;color:var(--muted);font-weight:600;margin:12px 0 4px}
.mic{margin-top:8px;font-size:.86rem;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.fstatus{font-size:.88rem;color:var(--muted)}
.reco{margin-top:12px;background:var(--sunk);border-radius:10px;padding:12px}
.reco .ftl{margin-top:8px;font-size:.93rem}
.reco ul.av{margin:8px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.thinking{color:var(--muted);font-style:italic;margin:0}
.reco.ferr{background:transparent;border:1px solid var(--bad);font-size:.92rem}
.reco.ferr b{color:var(--bad)}

/* Bloque de comer y beber */
.fuel{margin-top:10px;background:var(--sunk);border-radius:10px;padding:12px}
.sub .fuel{background:transparent;padding:0 0 12px;margin-top:0}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.fv{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.93rem}
.sumv.fv{font-weight:500;font-size:.88rem}
.fdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--rest)}
.fv-opt .fdot{background:var(--mod)}.fv-yes .fdot{background:var(--accent)}.fv-ok .fdot{background:var(--ok)}.fv-bad .fdot{background:var(--bad)}
.fuel dl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px 12px;margin:8px 0 0;font-size:.93rem}
.sub .fuel dl{margin-top:0}
.fuel dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:3px}
.fuel dd{margin:0;min-width:0}
.ftl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 10px}
.ftl li{display:contents}
.ftl b{font-family:var(--f-mono);font-weight:500;font-size:.82rem;color:var(--accent);padding-top:2px}
.fnote{margin-top:8px;font-size:.88rem;color:var(--muted)}
.fhint{display:block;margin-top:3px;font-size:.88rem;color:var(--accent)}

/* Pestaña Comida */
.flist{list-style:none;margin:6px 0 0;padding:0}
.flist li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0;padding-top:4px}
.fdate{text-align:center}
.fdate span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fdate b{font-family:var(--f-display);font-size:1.45rem;line-height:1}
.flist li.is-today .fdate b{color:var(--accent)}
.fname{font-weight:600;margin-bottom:2px}
.fwhen{font-size:.82rem;color:var(--muted);margin-top:3px}
.calc{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.crow.wide{grid-template-columns:130px minmax(0,1fr)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:.9rem;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.range{display:flex;align-items:center;gap:10px;min-width:0}
.range input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);min-width:6ch;text-align:right}
.crow>.stepper{justify-self:start}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:44px;height:40px;cursor:pointer;font-size:1.15rem}
.stepper output{min-width:3ch;text-align:center;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.lead{max-width:62ch}
.rsteps{margin:0;padding-left:20px;font-size:.95rem}
.rsteps li+li{margin-top:5px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two>div{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.two h3{font-size:1.1rem}
.two ul{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.two li+li{margin-top:3px}
.ing small{display:block;color:var(--muted);font-size:.86rem;margin-top:1px}
.cust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.cust li{padding-left:16px;position:relative}
.cust li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Cómo llegas hoy: resumen diario de Garmin que escribe Claude cada mañana */
.s-verde{background:var(--ok)}.s-ambar{background:var(--mod)}.s-rojo{background:var(--bad)}
.forma .meta{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.forma[open] .meta{display:block;-webkit-line-clamp:unset}
.fm-est{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.fm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
.fm-t{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.fm-t .label{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-t b{font-family:var(--f-display);font-size:1.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.fm-t b small{font-family:var(--f-body);font-size:.72rem;font-weight:500;color:var(--muted)}
.fm-d{font-size:.76rem;color:var(--muted)}
.fm-d.good{color:var(--ok)}.fm-d.bad{color:var(--bad)}
.fm-reco{margin-top:12px}
.fm-line{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
@media (min-width:561px){.fm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

@media (max-width:560px){
  .ex{grid-template-columns:1fr}
  .fig{max-width:320px}
  .exnotes{grid-template-columns:1fr}
  .steps{grid-template-columns:78px minmax(0,1fr);gap:6px 10px}
  .crow{grid-template-columns:1fr;gap:6px}

  .seg button{font-size:.86rem}
}

(function(){

const FTP = 245; const FTP_TEST = "2026-10-25";   // FTP_TEST: fecha del último test de FTP ("" = aún provisional). Lo cambia el informe diario tras un test.

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const fmtDur = m => m>=60 ? (Math.floor(m/60)+" h"+(m%60? " "+pad(m%60):"")) : m+"′";
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== Constructores de sesiones ===================== */
const CAL = ["Calentamiento","15′ suave (pulso < 155) + 8′ de técnica (skipping, talones, pies rápidos y saltitos de tobillo) + 4 progresivos de 20″ con cadencia alta"];

// Cadencia de carrera por fases (análisis de técnica del 25 oct: ~145 pasos/min en rodaje y zancada larga)
const CADRUN = "Metrónomo a 150–152 pasos por minuto: pasos más cortos y rápidos, sin subir el ritmo.";
const CADF = [   // [hasta (sin incluir), pasos/min en rodaje, cómo]
  ["2026-11-02",152,"5′ con él y 5′ sin él intentando mantener la frecuencia"],
  ["2026-11-09",152,"en 2 bloques de 10′"],
  ["2026-11-16",152,"todo el rodaje"],
  ["2026-11-23",156,"en 2 bloques de 10′"],
  ["2026-12-14",156,"todo el rodaje"],
  ["2026-12-21",160,"en 2 bloques de 10′"],
  ["9999-12-31",160,"todo el rodaje"]
];
const cadPhase = date => CADF.find(f=>date<f[0]);

  return {t:"str", n: light? "Rutina de cadera (ligera)" : "Rutina de cadera", d: light?8:15, k:"suave",

function futbol(rol, opts={}){

  return {t:"foot", n:"Fútbol ("+rol+")", d:60, k:"partido", s:"Sin reloj en el partido: apunta aquí los minutos y el esfuerzo (RPE 0–10).", log:"foot", tips, alt:opts.alt};

const descanso = (txt) => ({t:"rest", n:"Descanso", d:0, k:"descanso", s: txt || "Día libre. Duerme bien y come bien: aquí es donde asimilas lo entrenado."});

  Z4_3x10_135: {d:135, blk:55, steps:[["0–15′","Calentamiento"],["15–55′",`3 × 10′ a umbral, ${w(.98)}–${w(1.02)} W, 5′ suave entre medias`],["55–125′",`Zona 2 a ${w(.68)}–${w(.72)} W`],["125–135′","Vuelta a la calma"],["Al bajar","15′ de carrera suave (transición)"]]},
  SS_2x20_150: {d:150, blk:65, steps:[["0–15′","Calentamiento"],["15–65′",`2 × 20′ en sweet spot a ${w(.88)}–${w(.92)} W, 10′ suave entre medias`],["65–140′",`Zona 2 a ${w(.68)}–${w(.72)} W`],["140–150′","Vuelta a la calma"],["Al bajar","15′ de carrera suave (transición)"]]},
  SS_3x10_75: {d:75, blk:50, steps:[["0–12′",`Calentamiento ${w(.48)} → ${w(.68)} W`],["12–50′",`3 × 10′ en sweet spot a ${w(.88)}–${w(.92)} W, 4′ suave a ${w(.55)} W entre medias`],["50–65′",`Zona 2 a ${w(.68)}–${w(.72)} W`],["65–75′","Vuelta a la calma"]]},
  Z4_3x5_105: {d:105, blk:45, steps:[["0–15′","Calentamiento"],["15–45′",`3 × 5′ a ${w(1.0)}–${w(1.03)} W, 5′ suave entre medias`],["45–95′",`Zona 2 a ${w(.68)}–${w(.72)} W`],["95–105′","Vuelta a la calma"]]}
};
function bici(zwo, n, k, extra={}){
  const b = BIKE[zwo];
  const tips = ["Metrónomo a la cadencia del bloque (cada pitido, pie derecho abajo). El rodillo D100 no mide rpm.", ...(extra.tips||[])];
  return {t:"bike", n, d:b.d + (extra.brick||0), brick:extra.brick||0, k, zwo, steps: extra.brick? [...b.steps.filter(s=>s[0]!=="Al bajar"), ["Al bajar", extra.brick+"′ de carrera suave (transición)"]] : b.steps, s:extra.s, tips, outdoor:extra.outdoor};
}
function rodaje(min, n, extra={}){
  return {t:"run", n: n || ("Rodaje "+fmtDur(min)+" en zona 2"), d:min, k:"suave",
    s: extra.s || "Pulso 153–162 como máximo. Con calor, más lento: manda el pulso, no el ritmo.",
    steps: extra.steps, tips: [...(extra.tips || ["Sin cambios de ritmo: si es zona 2, es zona 2 todo el rato."]), ...(extra.cad===false?[]:[CADRUN])], alt: extra.alt};
}
function calidad(n, d, s, bloque, extra={}){
  return {t:"run", n, d, k:"calidad", s, steps:[CAL, ["Bloque principal", bloque], CALMA], tips:[COMP, TECQ, ...(extra.tips||[])], chk: extra.chk, alt: extra.alt};
}

/* ===================== Plan semana a semana ===================== */
const WEEKS = [
 {id:"S0", start:"2026-10-05", name:"Recuperación", role:"Resfriado: sin intensidad", vol:"~60 %", days:[
   [ {t:"run", n:"Series de umbral 3 × 10′", d:47, k:"calidad", s:"Hechas con resfriado: 4:18 · 4:40 · 4:45 /km. La primera, demasiado rápida.", steps:[CAL,["Bloque principal","3 × 10′ a umbral (2′ de trote)"],["Vuelta a la calma","5′"]]} ],
   [ bici("Z2_cadencia_45","Rodillo 45′ en zona 2 + cadencia","suave"), cadera() ],
   [ futbol("jugador") ],

   [ bici("Z2_90","Rodillo 1 h 30 en zona 2","suave") ]
 ]},
 {id:"S1", start:"2026-10-12", name:"Vuelta tras el resfriado", role:"Se recupera la sesión de VO2max", vol:"~80 %", days:[
   [ rodaje(62,"Rodaje 10 km suave (en lugar del umbral)",{s:"Cambiado por el resfriado. 6:10/km con pulso ~165 y malas sensaciones."}) ],
   [ bici("Z2_cadencia_60","Rodillo 60′ en zona 2 + cadencia","suave",{tips:["Si nunca lo has calibrado: tras el calentamiento, cierra Zwift y calibra con Onelap Fit."]}), cadera() ],
   [ futbol("jugador") ],
   [ futbol("portero") ],
   [ descanso() ],
   [ calidad("VO2max 4–5 × 3′", 50, "Solo si pasas el chequeo de salud por la mañana. Si no: 50–60′ suaves + 6 × 20″, y las series pasan al lunes.",
       "4–5 × 3′ a 3:55–4:05 /km con 2′ de trote. La 1.ª a 4:05. La 5.ª solo si en la 4.ª mantuviste el ritmo; para si el ritmo cae más de 5″ o el pulso no baja de ~160 en la recuperación.",
       {chk:true, tips:["El pulso llegará a 185–190 al final de cada serie: aquí manda el ritmo."]}) ],
   [ bici("Z2_110","Bici 1 h 50 en zona 2 + transición","suave",{brick:10, s:"Sin test esta semana: el test de FTP pasa al domingo 25.", outdoor:true}), cadera() ]
 ]},
 {id:"S2", start:"2026-10-19", name:"Construcción", role:"Semana reorganizada: sweet spot el lunes, umbral el miércoles + test de FTP", vol:"100 %", days:[
   [ Object.assign(bici("SS_3x10_75","Rodillo 1 h 15 con 3 × 10′ en sweet spot","calidad",{s:"Cambiado por la lluvia: la sesión intensa de bici del miércoles pasa a hoy, bajo techo. Las series de carrera, mañana.", tips:["Sweet spot: duro pero sostenible, podrías decir frases cortas. Si la última serie no sale, para en la segunda.","Mañana hay umbral corriendo: no te pases de los vatios."]}), {alt:"Si estás muy cargado del domingo: rodillo 60′ en zona 2 (Z2_cadencia_60) y el sweet spot vuelve al miércoles."}) ],
   [ bici("Z2_cadencia_60","Rodillo 60′ en zona 2 + cadencia","suave",{s:"Hoy no puedes correr: el rodillo suave del miércoles pasa a hoy y el umbral, a mañana. Suave de verdad: ayer ya hubo sweet spot."}), cadera() ],
   [ Object.assign(calidad("Umbral 3 × 8′", 55, "Las series de umbral del lunes, movidas por la lluvia y por el martes. Primera sesión de series con la banda H9.", "3 × 8′ a 4:40–4:45 /km (pulso 174–180, sin pasar de 182), 2′ de trote entre series."), {alt:"Si hoy tampoco puedes correr: rodillo 45′ suave y el umbral pasa al jueves, cambiándolo por el rodaje."}) ],
   [ descanso("Día libre (movido del viernes al jueves). Mañana rodaje suave.") ],

   [ rodaje(70,"Tirada larga 70′ (~11–12 km)",{tips:["Zona 2 estricta. Si notas el psoas, acorta a 60′ y avísame."]}) ],
   [ {t:"test", n:"Test de FTP (rampa) + 45′ en zona 2", d:75, k:"test", s:"Calibra el rodillo antes (después de calentar). Usa el Ramp Test de Zwift en modo ERG.", steps:[["0–10′","Calentamiento suave + calibración en Onelap Fit"],["Rampa","Empieza a ~100 W, +20 W cada minuto hasta no poder mantener la potencia"],["Después","10′ suave y luego Z2_cadencia_45"]], tips:["FTP = 75 % de tu mejor minuto. Apunta el resultado en la nota: recalculo todas las zonas de bici."], go:"test", zwo:"Z2_cadencia_45"}, cadera() ]
 ]},

   [ rodaje(45,"Rodaje 45′ + técnica + 6 × 20″",{s:"Primer rodaje con la técnica completa. Pulso 153–162 en la parte continua.",

       tips:["Los progresivos, pensando en dar pasos rápidos, no largos: soltura, no velocidad máxima."],
       alt:"Si vas cargado del test de FTP: 40′ suaves sin progresivos y la técnica en versión corta (pies rápidos y saltitos)."}), cadera() ],
   [ descanso("Examen: descanso total. Lo más importante hoy es haber dormido bien.") ],

        alt:"Si el miércoles no puedes: hazla el jueves, el rodillo suave pasa al miércoles y la bici del viernes se queda en 60′ en zona 2 (Z2_cadencia_60)."}) ],
   [ Object.assign(bici("Z2_cadencia_60","Rodillo 60′ en zona 2 + cadencia","suave",{s:"Aeróbico sin impacto, el día después de la prueba. Suave de verdad."}), {alt:"Si los exámenes te aprietan: 45′ (Z2_cadencia_45) o descanso."}) ],
   [ Object.assign(bici("SS_3x10_75","Rodillo 1 h 15 con 3 × 10′ en sweet spot + transición","calidad",{brick:10, s:"La bici con bloques del domingo pasa a hoy, porque el domingo no puedes entrenar. Al bajar, 10′ de carrera suave a 152–155 pasos por minuto: con las piernas de la bici se tiende a dar pasos largos.", tips:["Sweet spot: duro pero sostenible, podrías decir frases cortas. Si la tercera serie no sale, para en la segunda.","Mañana hay tirada: no te pases de los vatios."]}), {alt:"Si vas muy cargado o justo de tiempo: rodaje de soltura 30′ + 3 × pies rápidos, y la bici con bloques se pierde esta semana."}), cadera() ],
   [ rodaje(60,"Tirada 60′ en zona 2",{tips:["Zona 2 estricta (pulso 153–162): manda el pulso, no el ritmo.","Si notas el psoas o el gemelo, acorta a 45′ y avísame."]}) ],
   [ descanso("Hoy no puedes entrenar: descanso. Mañana empieza la semana de la carrera con una activación corta.") ]

const chains={}; const timers={};
function persist(id){
  const e = LOG[id] || {};
  const empty = !e.status && e.rpe==null && e.min==null && !e.note && !e.hora;
  if(!db){ if(empty) delete LOG[id]; lsSave(); return; }
  const ref = db.collection("log").doc(id);
  chains[id] = (chains[id]||Promise.resolve()).then(()=> empty ? ref.delete() : ref.set({status:e.status||null, rpe:e.rpe??null, min:e.min??null, note:e.note||"", hora:e.hora||null, at:new Date().toISOString()}))
    .catch(err=>{ setSync("err", err && err.code==="quota_exceeded" ? "Almacenamiento lleno" : "No se pudo guardar; reintenta"); });
}
function persistSoon(id){ clearTimeout(timers[id]); timers[id]=setTimeout(()=>persist(id),700); }

/* ===================== Alimentación: qué tomar en cada sesión ===================== */
const KG = 71;
const FKEY = "camino703-fuel";
const FP = {gel:25, bw:26, pct:85, n:4, tex:"normal"};   // g de hidratos por gel; bocadillito: peso y % de hidratos (etiqueta); receta
try{ const o=JSON.parse(localStorage.getItem(FKEY)||"{}"); if(o.bw===18) delete o.bw; Object.assign(FP, o); }catch(e){}   // 18 g era el valor provisional
function fpSave(){ try{ localStorage.setItem(FKEY, JSON.stringify(FP)); }catch(e){} }
const plural = (n,a,b) => n+" "+(n===1?a:b);
const bocG = () => Math.max(1, Math.round(FP.bw*FP.pct/100));
// Una toma de gel son ~25 g: los geles grandes (50 g) dan para dos tomas
const BIG = () => FP.gel>30;
const dose = () => BIG() ? FP.gel/2 : FP.gel;
const bocN = () => Math.max(1, Math.round(dose()/bocG()));      // bocadillitos que equivalen a una toma de gel
const bocTxt = k => `${k} bocadillito${k>1?"s":""} de guayaba (~${k*bocG()} g)`;
const gelTxt = () => BIG() ? `½ gel de ${FP.gel} g (~${dose()} g)` : `1 gel de ${FP.gel} g`;
const half = x => { const w=Math.floor(x), h=x>w; return (w||!h?String(w):"")+(h?"½":""); };   // 1.5 → "1½"
const gelsTxt = tomas => { const u=BIG()?tomas/2:tomas; return half(u)+" "+(u>1?"geles":"gel"); };
const gelsToMake = tomas => Math.ceil(BIG()?tomas/2:tomas);   // lo que sobra en el flask no se guarda
const r5 = x => Math.round(x/5)*5;
const num = x => String(x).replace(".",",");
const HARD = ["calidad","test","carrera","partido"];
const POST_FULL = () => `En la hora siguiente, comida con ${KG}–${Math.round(KG*1.2)} g de hidratos y 20–25 g de proteína: arroz o pasta con pollo, huevos o atún. Si la comida queda lejos: leche o yogur con plátano y 2 bocadillitos.`;

function fuelCore(o){
  const G=FP.gel, D=dose(), d=o.d||0, hard=HARD.includes(o.k), race=o.k==="carrera";
  const f={lvl:"none", head:"Sin gel", pre:"", during:[], water:"", post:"Tu comida normal.", note:"", n:0, gels:0, bocs:0, rate:0};
  if(o.sport==="foot"){
    return Object.assign(f,{lvl:"opt", head:"Sin gel · algo antes del partido",
      pre:"Si comiste hace más de 3 h: 1–2 bocadillitos 30–45′ antes.",
      during:[["Descanso",`Agua y, si juegas el partido entero, ${bocTxt(1)}.`]],
      water:"Bebe en cada parón; con calor, más.",
      post:"Cena con hidratos y proteína: al día siguiente vuelves a entrenar o a jugar."});
  }
  if(o.sport==="test"){
    return Object.assign(f,{lvl:"opt", head:"Sin gel en la rampa · algo antes",
      pre:"Comida normal 2–3 h antes y 1–2 bocadillitos 30–45′ antes: a la rampa hay que llegar con energía.",
      during:[["Rampa","Nada: dura 15–20′ y no da tiempo a absorberlo."],["Zona 2",`Opcional: ${bocTxt(bocN())} al empezarla.`]],
      water:"Bidón a mano y ventilador fuerte: en la rampa se suda mucho.", post:POST_FULL()});
  }
  const run=o.sport==="run";
  // Gramos de hidratos por hora según duración (corriendo se tolera menos que en bici)
  let rate;
  if(run) rate = race ? (d<=75?0:45) : (d<75?0:d<105?25:d<150?40:50);
  else { rate = d<75?0:d<105?30:d<150?45:60; if(rate && hard) rate=Math.min(60,rate+10); }
  if(rate){
    const toma = run ? D : (D + bocN()*bocG())/2;   // en bici, media entre gel y bocadillito
    const n=Math.max(1,Math.round(rate*d/60/toma));
    const t0= run ? (race?35:45) : (race?15:20);
    const t1= d-15;
    const times = n===1 ? [t0] : Array.from({length:n},(_,i)=>r5(t0+i*(t1-t0)/(n-1)));
    if(run) times.forEach(t=>{ f.during.push([t+"′",`${gelTxt()} con 150–200 ml de agua`,BIG()?"½ gel":"gel"]); f.gels++; });   // corriendo, solo geles
    else {
      // Bici: mitad geles, mitad bocadillitos. Dentro de los bloques intensos, gel (no hay que masticar).
      const inBlk = t => o.blk && t<=o.blk;
      const blkN = times.filter(inBlk).length, L = times.length-blkN;
      const remG = Math.max(0, Math.floor(times.length/2)-blkN);
      let j=0;
      times.forEach(t=>{
        if(inBlk(t)){ f.during.push([t+"′",`${gelTxt()}: en el bloque intenso, mejor sin masticar`,BIG()?"½ gel":"gel"]); f.gels++; return; }
        const gel = Math.floor((j+1)*remG/L) > Math.floor(j*remG/L); j++;   // reparte los geles; empieza por bocadillito
        if(gel){ f.during.push([t+"′",gelTxt(),BIG()?"½ gel":"gel"]); f.gels++; }
        else { const k=bocN(); f.during.push([t+"′",bocTxt(k),k+" boc."]); f.bocs+=k; }
      });
    }
    f.n=n; f.rate=Math.round((f.gels*D+f.bocs*bocG())*60/d); f.lvl="yes";   // f.gels = tomas de gel
    f.head = run ? (n===1?`${gelTxt()} en el minuto ${t0}`:`${gelsTxt(n)} de ${G} g`)
      : `${f.gels?gelsTxt(f.gels)+" de "+G+" g":""}${f.gels&&f.bocs?" + ":""}${f.bocs?plural(f.bocs,"bocadillito","bocadillitos"):""} · ${f.rate} g/h`;
  }
  else if(race) f.head="Sin gel: la energía viene del desayuno";
  else if(hard){ f.lvl="opt"; f.head="Sin gel · algo antes si llegas con hambre"; }
  // Antes
  if(race) f.pre = d>75 ? "Cena anterior rica en hidratos y desayuno 3 h antes con ~2 g/kg (~140 g de hidratos). Nada nuevo."
    : "Desayuno de siempre 3 h antes con ~1,5 g/kg de hidratos (~100 g: pan con mermelada o miel, plátano y zumo). Opcional: 1 bocadillito 30–45′ antes de calentar.";
  else if(d>=90) f.pre="Comida con hidratos 2–3 h antes (arroz, pasta, pan o avena). Si han pasado más de 3 h o sales con hambre: 2 bocadillitos 30′ antes.";
  else if(hard) f.pre="Si hace más de 3 h que comiste: 1–2 bocadillitos 30–45′ antes.";
  else f.pre="Nada especial: solo no salir con hambre.";
  // Beber
  if(run) f.water = race && !rate ? "Un par de sorbos en el avituallamiento si hace calor."
    : d<75 ? "Bebe al terminar; con calor, lleva agua."
    : `Lleva agua: 400–600 ml por hora${f.gels?" y 150–200 ml con cada toma de gel":""}.`;
  else f.water = o.outdoor ? "Un bidón (500–750 ml) por hora." : "Ventilador y un bidón (500–750 ml) por hora: en el rodillo sudas más que en la calle.";
  if(d>=120) f.water += " Pizca de sal en el bidón.";
  // Después
  if(d>=90 || hard) f.post=POST_FULL();
  const notes=[];
  if(f.gels && run) notes.push("Del flask, en 2–3 sorbos durante un minuto. Nunca a la vez que un isotónico.");
  if(f.gels && BIG()) notes.push(`Cada gel de ${G} g da para dos tomas: márcale la mitad al flask.`);
  if(f.bocs && o.outdoor) notes.push("Desenvuelve los bocadillitos antes de salir y llévalos en una bolsita: en marcha y con guantes no se abren.");
  if(f.lvl==="yes") notes.push("Apunta en la nota qué tomaste y cómo te sentó (estómago 0–10).");
  f.note=notes.join(" ");
  return f;
}

function addPlan(f,o){
  const st=toMin(o.hora); if(st==null) return f;
  const dur=o.total||o.d||60, end=st+dur, race=o.k==="carrera";
  const big = race || o.sport==="foot" || o.sport==="test" || HARD.includes(o.k) || dur>=90;
  const meals=dayMeals(o.date||TODAY);
  const mt = m => m.n==="Comida" ? `${hhmm(m.t)}–${hhmm(m.t+60)}` : hhmm(m.t);
  const g = m => m.n==="Desayuno" ? "o" : "a";
  const B=[], A=[];
  const prev = meals.filter(m=>m.t+m.dur<=st-30).pop();          // última comida que da tiempo a hacer antes
  const missed = meals.filter(m=>m.t+m.dur>st-30 && m.t<end-15);   // comidas que caen encima de la sesión
  const clash = missed.find(m=>m.t<st);
  // Antes
  if(race){
    B.push([at(st-180), "Desayuno de siempre con ~100 g de hidratos: pan con mermelada o miel, plátano y zumo. Nada nuevo."]);
    B.push([at(st-45), "Opcional: 1 bocadillito antes de calentar. Agua a sorbos."]);
  } else {
    if(prev){
      const gap=st-(prev.t+prev.dur);
      if(gap>=150) B.push([mt(prev), `${prev.n}: ${prev.n==="Desayuno" ? (big?BREAKFAST_BIG:BREAKFAST_NORMAL) : (big?MEAL_BIG:MEAL_NORMAL)}`]);
      else if(gap>=60) B.push([mt(prev), `${prev.n} algo más liger${g(prev)} de lo normal, porque entrenas a las ${hhmm(st)}: hidratos fáciles (arroz, pasta, patata o pan), poca grasa y poca fibra.`]);
      else B.push([mt(prev), `${prev.n} muy liger${g(prev)}: con menos de 1 h para digerir, mejor una tostada con mermelada o un plátano, y lo fuerte después de entrenar.`]);
      if(!clash){
        if(big && gap>=180) B.push([at(st-75), `${snackName(st-75)}: ${SNACK}`]);
        else if(!big && gap>=240) B.push([at(st-45), "Si tienes hambre: 1 bocadillito o un plátano."]);
      }
    } else if(!clash){
      if(!big) B.push([at(st-30), "Basta con 1 bocadillito o medio plátano. El desayuno de verdad, al volver."]);
      else if(st<7*60+30) B.push([at(st-30), "Sin tiempo para desayunar: 1–2 bocadillitos con zumo o agua. La cena de la víspera, con hidratos."]);
      else B.push([at(st-90), "Desayuno ligero (~50–70 g de hidratos): tostada con mermelada o miel y un plátano. Poca grasa y fibra."]);
    }
    if(clash) B.push([mt(clash), `${clash.n}: a esa hora no da tiempo a digerirl${g(clash)} antes de entrenar. Pásal${g(clash)} a después de la sesión y toma a las ${at(st-75)} algo ligero, como una tostada con mermelada o un plátano.`]);
  }
  // Después
  const rec = n => n==="Desayuno" ? REC_BREAKFAST : REC_MEAL();
  const drink = " Y ~500 ml de agua en la hora siguiente.";
  let nx = meals.find(m=>m.t>=end-15);
  if(big){
    if(missed.length){ const m=missed[missed.length-1]; A.push([at(end+15), `${m.n} de recuperación: ${rec(m.n)}${drink}`]); }
    else if(nx && nx.t-end<=90){ A.push([mt(nx), `${nx.n} de recuperación: ${rec(nx.n)}${drink}`]); nx=meals[meals.indexOf(nx)+1]; }
    else A.push([at(end+15), `Recuperación rápida: ${REC_SNACK}${drink}`]);
    if(nx) A.push([mt(nx), `${nx.n} con hidratos y proteína.`]);
    if(o.nextHard){
      let i=A.findIndex(x=>x[1].startsWith("Cena"));
      const cena=meals.find(m=>m.n==="Cena");
      if(i<0 && cena && cena.t>end){ A.push([mt(cena), "Cena con hidratos."]); i=A.length-1; }
      if(i<0) i=A.length-1;
      A[i][1] += ` Mañana toca «${o.nextHard}»: ${A[i][1].startsWith("Cena")?"esta cena":"esta comida"} la recarga.`;
    }
    if(end>=22*60) A[0][1] += " Es tarde: misma cantidad, pero fácil de digerir (arroz, tortilla, pan, yogur) y sin fritos, para dormir bien.";
  } else {
    if(missed.length){ const m=missed[missed.length-1]; A.push([at(end+15), `${m.n} normal, al terminar.`]); }
    else if(nx) A.push([mt(nx), `${nx.n} normal, a su hora.`]);
    else A.push([at(end+30), "Tu cena normal."]);
  }
  f.plan={start:st, end, B, A};
  return f;
}

async function askFood(){
  if(FOOD.busy) return;
  if(SAMPLE===undefined){ setFoodStatus("Conectando con Claude… vuelve a pulsar en unos segundos."); return; }
  if(!SAMPLE) return;
  if(!FOOD.comido.trim() && !FOOD.plan.trim()){ setFoodStatus("Primero escribe o dicta lo que has comido o lo que piensas comer."); return; }
  foodCtl=new AbortController(); FOOD.busy=true; FOOD.err=null; FOOD.t0=Date.now(); setFoodStatus(""); refreshFoodCard();
  foodTick=setInterval(()=>{ const el=document.getElementById("food-secs"); if(el) el.textContent=Math.round((Date.now()-FOOD.t0)/1000); },1000);
  try{
    const r = await SAMPLE.json(foodPrompt(), {signal:foodCtl.signal, onText:()=>setFoodStatus("Escribiendo la recomendación…")});
    if(!r || typeof r!=="object" || !r.veredicto) throw {code:"invalid_json"};
    FOOD.reco={estado:String(r.estado||""), veredicto:String(r.veredicto),
      hidratos: typeof r.hidratos==="number" ? r.hidratos : null,
      plan: (Array.isArray(r.plan)?r.plan:[]).slice(0,8).map(x=>({hora:String((x&&x.hora)||""), que:String((x&&x.que)||"")})).filter(x=>x.que),
      avisos: (Array.isArray(r.avisos)?r.avisos:[]).slice(0,4).map(String)};
    FOOD.at=new Date().toISOString(); FOOD.busy=false; setFoodStatus(""); foodSave();
  }catch(e){
    FOOD.busy=false; const code=(e && e.code) || "desconocido";
    console.warn("Comida de hoy: la consulta a Claude falló", e);
    if(["sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) SAMPLE=null;
    if(code!=="cancelled"){ FOOD.err={code, at:new Date().toISOString()}; foodSave(); }
  }finally{ foodCtl=null; clearInterval(foodTick); refreshFoodCard(); }
}

   <ol class="rsteps">
    <li>Pesa la maltodextrina y la fructosa con una báscula de cocina.</li>
    <li>Calienta el agua hasta que esté tibia (40–50 °C, sin hervir). Echa primero la fructosa y remueve hasta que desaparezca.</li>
    <li>Añade la maltodextrina en 2 o 3 tandas, batiendo con un tenedor o unas varillas entre tanda y tanda. Si la echas de golpe, hace grumos. Si cuesta disolverla, 5 ml más de agua.</li>
    <li>Deja que se temple, añade el zumo de limón colado (la pulpa atasca el flask) y la sal, y remueve.</li>
    <li>Pásalo a un flask o a bolsitas reutilizables limpias, apunta la fecha y a la nevera.</li>
   </ol>
   <p class="fnote">El tamaño que elijas aquí es el que usan las recomendaciones de toda la página. Un gel de 50 g cuenta como dos tomas de 25 g.</p>`)}
  ${acc("c-conserva","¿Cuánto aguanta el gel?",`<div class="tbl"><table><thead><tr><th>Cómo lo guardas</th><th>Cuánto dura</th></tr></thead><tbody>
    <tr><td>Mezcla seca (maltodextrina + fructosa + sal) en bolsitas o tarro cerrado</td><td><b>Meses</b>, como los botes, en sitio seco</td></tr>
    <tr><td>Gel hecho, en la nevera, en recipiente limpio y cerrado</td><td><b>3–4 días</b></td></tr>
    <tr><td>Congelado en dosis</td><td><b>Hasta 1 mes</b>. Descongélalo en la nevera la noche antes y agítalo</td></tr>
    <tr><td>Fuera de la nevera, en el bolsillo</td><td><b>Solo el día que lo usas</b></td></tr>
    <tr><td>Lo que sobra en el flask al volver</td><td><b>A la basura</b>: ya ha tocado tu boca</td></tr>
   </tbody></table></div>
   <p>El azúcar no lo conserva como a la miel porque lleva demasiada agua, y el limón natural trae levaduras: trátalo como comida fresca. Tíralo si ves burbujas o espuma, huele agrio o a alcohol, o sabe picante.</p>
   <ul class="cust">
    <li><b>Lo práctico:</b> el domingo prepara las dosis secas en bolsitas. La víspera de cada sesión larga, añade agua y limón.</li>
    <li>Con limón embotellado o una pizca de ácido cítrico en vez de limón natural aguanta algo mejor, pero mantén la regla de 3–4 días.</li>
    <li>Lava el flask con agua caliente y jabón al llegar y déjalo secar abierto.</li>
   </ul>`)}
  ${acc("c-reglas","¿Cuándo hace falta gel?",`<div id="c-reglas-out"></div>`)}
  ${acc("c-calc","Sesión fuera del plan",`<p class="muted">Una salida con amigos, un rodaje extra o un partido: elige y te digo qué llevar.</p>

    <div class="crow"><label class="label" for="calc-h">Hora</label><div class="range"><input type="time" id="calc-h" step="300" value="${CALC.hora}"><span class="muted" style="font-size:.86rem">a la que empiezas</span></div></div>
    <div class="crow" id="calc-krow"${CALC.sport==="foot"?" hidden":""}><span class="label">Intensidad</span><div class="chips">${chipBtns("ck",CALC.k,[["suave","Suave"],["calidad","Series / bloques"],["carrera","Competición"]])}</div></div>
   </div>
   <div id="c-calc-out"></div>`)}
  ${acc("c-habitos","Mis horarios",`<p class="muted lead">Con esto ajusto qué comer antes y después de cada sesión, y lo tiene en cuenta Claude al recomendarte. El desayuno, el fin de semana y la cena son una suposición mía: cámbialos si no aciertan.</p>
   <div class="calc">${[["des","Desayuno"],["lj","Comida lun–jue"],["v","Comida viernes"],["s","Comida sábado"],["d","Comida domingo"],["cena","Cena"]].map(([k,t])=>`<div class="crow wide"><label class="label" for="hab-${k}">${t}</label><div class="range"><input type="time" id="hab-${k}" data-hab="${k}" step="300" value="${esc(HAB[k])}"></div></div>`).join("")}
    <div class="crow wide"><label class="label" for="hab-otros">Otros hábitos</label><textarea id="hab-otros" data-hab="otros" placeholder="Ej.: no tomo lactosa; los martes como en la universidad; ceno ligero.">${esc(HAB.otros)}</textarea></div>
   </div>`)}
  ${acc("c-boc","Bocadillitos de guayaba",`<p class="lead">Casi todo hidratos, con muy poca grasa, proteína o fibra, así que se digieren rápido. Los datos de abajo son los de tu etiqueta; si cambias de marca, cámbialos y toda la página se recalcula.</p>
   <div class="calc">
    <div class="crow"><label class="label" for="pref-bw">Peso de uno</label><div class="range"><input type="number" id="pref-bw" min="5" max="100" inputmode="numeric" value="${FP.bw}"><span class="muted" style="font-size:.86rem">g</span></div></div>
    <div class="crow"><label class="label" for="pref-pct">Hidratos</label><div class="range"><input type="number" id="pref-pct" min="5" max="100" inputmode="numeric" value="${FP.pct}"><span class="muted" style="font-size:.86rem">g por 100 g</span></div></div>

   <div id="c-boc-out"></div>
   <div class="two">
    <div><h3>Bocadillitos</h3><ul><li>Bici: la mitad de las tomas, mejor en la parte suave de la salida.</li><li>Antes de correr o de entrenar: 1–2, de 30 a 45′ antes.</li><li>Después de correr, con un yogur o un vaso de leche.</li><li>En el descanso del fútbol.</li></ul></div>
    <div><h3>Geles</h3><ul><li>Siempre mientras corres.</li><li>Bici: la otra mitad de las tomas.</li><li>Dentro de los bloques de sweet spot o umbral: masticar con la respiración a tope cuesta.</li></ul></div>
   </div>
   <p class="fnote">Quítales la hoja de bijao o el plástico antes de salir y llévalos en una bolsita zip en el bolsillo del maillot.</p>`)}
  ${acc("c-carreras","Plan en competición",`<div id="c-carreras-out"></div>`)}
  ${acc("c-estomago","Entrenar el estómago",`<p>En la media de enero el gel te sentó mal. El intestino se entrena como las piernas: si lo usas en los entrenamientos, absorbe más y protesta menos.</p>
   <div class="tbl"><table><thead><tr><th>Cuándo</th><th>Qué practicar</th></tr></thead><tbody>

   </tbody></table></div>

  </div>`;

}
function fillComida(){ fillNext(); fillCalc(); fillReglas(); fillRec(); fillBoc(); fillCarreras(); }
function fillNext(){
  const el=document.getElementById("c-next"); if(!el) return;
  let rows="", gels=0, bocs=0;
  for(let i=0;i<7;i++){
    const date=addDays(TODAY,i); const info=DAYMAP[date]; if(!info) continue;
    info.wk.days[info.i].forEach(s=>{
      const f=fuelOf(s); if(!f) return;
      gels+=gelsToMake(f.gels); bocs+=f.bocs;
      const when=f.during.filter(x=>x[2]).map(x=>x[0]+" "+x[2]).join(" · ");
      rows+=`<li class="${date===TODAY?"is-today":""}"><div class="fdate"><span>${i===0?"hoy":DOWS[dowIdx(date)]}</span><b>${parse(date).getDate()}</b></div>
       <div style="min-width:0"><div class="fname">${esc(s.n)}</div>${fvHTML(f)}${f.lvl==="yes"&&when?`<div class="fwhen mono">${esc(when)}</div>`:""}</div></li>`;
    });
  }
  if(!rows){ el.innerHTML=`<p class="muted" style="margin-top:6px">No hay sesiones del plan en los próximos días. Usa «Sesión fuera del plan».</p>`; return; }
  el.innerHTML=`<ul class="flist">${rows}</ul>`+((gels||bocs)
    ? `<p class="note" style="margin-top:8px"><b>Para preparar:</b> ${plural(gels,"gel","geles")} de ${FP.gel} g${bocs?` y ${bocs} bocadillitos`:""} para durante las sesiones, más 1–2 bocadillitos para antes de las de calidad. Haz el gel la víspera: en la nevera aguanta 3–4 días.</p>`
    : `<p class="note" style="margin-top:8px">Esta semana no necesitas geles. Ten a mano 1–2 bocadillitos para antes de las sesiones de calidad.</p>`);
}
function fillCalc(){
  const el=document.getElementById("c-calc-out"); if(!el) return;
  const o=document.getElementById("calc-do"); if(o) o.textContent=fmtDur(CALC.d);
  el.innerHTML=fuelHTML(fuelFor({sport:CALC.sport, d:CALC.d, total:CALC.d, k:CALC.sport==="foot"?"partido":CALC.k, outdoor:true, hora:CALC.hora}));
}
function fillReglas(){
  const el=document.getElementById("c-reglas-out"); if(!el) return;
  const D=dose(), k=bocN();
  const rows=[["Menos de 60′","Nada","Nada"],
    ["60–75′","Nada. En series, algo antes si llegas con hambre","Nada"],
    ["75′ – 1 h 45","Una toma de gel en el minuto 45 (20–25 g/h)","30–40 g/h: una toma cada 30–40′ desde el minuto 20"],
    ["1 h 45 – 2 h 30","40 g/h: una toma de gel cada 30′ desde el minuto 45","45–55 g/h: una toma cada 25′"],
    ["Más de 2 h 30","50 g/h","60 g/h, subiendo hacia 80–90 para el 70.3"]];
  el.innerHTML=`<div class="tbl"><table><thead><tr><th>Duración</th><th>Carrera</th><th>Bici</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
   <p class="muted" style="font-size:.88rem">Una toma de gel son ~${D} g${BIG()?` (medio gel de ${FP.gel} g)`:""}. En bici, la mitad de las tomas son de gel y la otra mitad ${k>1?k+" bocadillitos":"un bocadillito"} (~${k*bocG()} g); dentro de los bloques intensos, gel. En sesiones con bloques intensos se suben ~10 g/h. Corriendo, solo geles; los bocadillitos, antes o después.</p>
   <ul class="cust">
    <li>Por debajo de 75′ tus músculos tienen glucógeno de sobra: el gel no te hace más rápido y solo añade riesgo de molestias.</li>
    <li>Empieza antes de notar el bajón: corriendo en el minuto 45, en bici en el 20.</li>
    <li>Poco y a menudo: tomas de ~${D} g sientan mejor que una dosis grande. Un gel de 50 g entero de golpe es mucha carga para tu estómago: mejor en dos tomas separadas 25–30′.</li>
    <li>Siempre con agua (150–200 ml). Nunca gel e isotónico a la vez: se suman los azúcares y el estómago se atasca.</li>
    <li>En la bici se come; corriendo, solo geles. Sentado, el estómago tolera mucho más que con los impactos.</li>
    <li>En competición, nada que no hayas probado entrenando.</li>
   </ul>`;
}
function fillRec(){
  const el=document.getElementById("c-rec-out"); if(!el) return;
  const n=FP.n, G=FP.gel, C=n*G;
  const malto=Math.round(C*2/3), fru=Math.round(C/3);
  const water=Math.max(5, r5(C*(FP.tex==="suave"?1.4:0.8)));
  const lemon=Math.round(C/5), vol=Math.round(water+lemon+C*0.63), per=Math.round(vol/n);
  const rn=document.getElementById("rec-n"); if(rn) rn.textContent=n;
  el.innerHTML=`<div class="tbl"><table><thead><tr><th>Ingrediente</th><th>Cantidad</th></tr></thead><tbody>
   <tr><td class="ing"><b>Maltodextrina</b><small>Glucosa de absorción rápida y poco dulce.</small></td><td class="mono">${malto} g</td></tr>
   <tr><td class="ing"><b>Fructosa</b><small>Va por otra vía del intestino: absorbes más con menos molestias.</small></td><td class="mono">${fru} g</td></tr>
   <tr><td class="ing"><b>Agua tibia</b><small>${FP.tex==="suave"?"Más diluido: más fácil para el estómago. Llévalo en flask.":"Textura de gel líquido, como uno comercial."}</small></td><td class="mono">${water} ml</td></tr>
   <tr><td class="ing"><b>Zumo de limón</b><small>${num(lemon/5)} cucharadita${lemon>5?"s":""}, colado. Corta el dulzor.</small></td><td class="mono">${lemon} ml</td></tr>
   <tr><td class="ing"><b>Sal</b><small>Una pizca por cada 25 g de hidratos (~80 mg de sodio).</small></td><td class="mono">${num((C*0.008).toFixed(1))} g</td></tr>
  </tbody></table></div>
  <p class="muted" style="font-size:.88rem">Salen unos ${vol} ml: ${n} gel${n>1?"es":""} de ${G} g de hidratos, ~${per} ml cada uno${BIG()?", dos tomas por gel":""}. ${vol<=150?"Cabe en un flask de 150 ml.":vol<=250?"Usa un flask de 250 ml o dos de 150 ml.":"Repártelo en varios flasks."}</p>`;
}
function fillBoc(){
  const el=document.getElementById("c-boc-out"); if(!el) return;
  const b=bocG(), k=bocN(), f2=fuelFor({sport:"bike", d:120, k:"suave"});
  el.innerHTML=`<div class="stats" style="margin-top:12px">
   <div class="stat"><span class="label">Hidratos por unidad</span><b class="mono">~${b} g</b></div>
   <div class="stat"><span class="label">= 1 toma de gel (${dose()} g)</span><b class="mono">${k} boc.</b></div>
   <div class="stat"><span class="label">2 h de bici: geles + boc.</span><b class="mono">${f2.gels} + ${f2.bocs}</b></div></div>`;
}
function fillCarreras(){
  const el=document.getElementById("c-carreras-out"); if(!el) return;
  const hm=fuelFor({sport:"run", d:105, k:"carrera"});
  el.innerHTML=`<p><b>10K (8 nov y 13 dic).</b> Sin gel. Desayuno de siempre 3 h antes con ~100 g de hidratos y, si quieres, 1 bocadillito 30–45′ antes de calentar. Agua en el avituallamiento solo si hace calor.</p>
   <p><b>Media maratón (feb–mar, ~1 h 45).</b> El día anterior, más hidratos de lo normal (~6–7 g/kg, unos 450 g) y poca fibra. Desayuno 3 h antes con ~140 g. Durante: ${hm.during.map(x=>x[0]).join(", ")} → ${gelsTxt(hm.n)} de ${FP.gel} g con agua (~${hm.rate} g/h), solo si lo has ensayado en tiradas.</p>
   <p><b>Triatlón olímpico (abril).</b> Bici: un gel a los 15′ y un bocadillito o un gel a los 45′, con agua. Carrera: un gel en el km 3 si lo llevas entrenado. Es el ensayo de la nutrición del 70.3.</p>
   <p><b>70.3 (finales de mayo).</b> La comida es la cuarta disciplina. Bici (~3 h): 60–80 g/h desde el minuto 15, es decir, 7–9 tomas, mitad geles y mitad bocadillitos (los bocadillitos, mejor en la primera mitad). Para pasar de 80 g/h, cambia la receta a 1:0,8 (14 g de maltodextrina y 11 g de fructosa por gel). Carrera: 40–60 g/h, un gel cada 25–30′ con agua en los avituallamientos. Con calor, 300–600 mg de sodio por hora. Todo se ensaya antes en los bricks largos.</p>`;
}

/* ===================== Cambios: pedir ajustes de la semana desde el móvil ===================== */
const OVR = {};            // id de semana → cambio aplicado (guardado en la base de datos)
let PET = [];              // historial de peticiones
const TYPES=["run","bike","foot","str","rest","race","test"], KS=["suave","calidad","test","carrera","partido","descanso"];
const CADBIKE = "Metrónomo a la cadencia del bloque (cada pitido, pie derecho abajo). El rodillo D100 no mide rpm.";
const strv = (v,n) => typeof v==="string" ? v.trim().slice(0,n) : "";
const numv = (v,a,b,def) => { const x=Number(v); return isFinite(x) ? Math.min(b,Math.max(a,Math.round(x))) : def; };
function serSession(s){
  if(s.t==="rest") return {t:"rest", s:s.s};
  if(s.t==="str") return {t:"str", light:/ligera/.test(s.n)};
  if(s.t==="foot") return {t:"foot", rol:/portero/.test(s.n)?"portero":"jugador", alt:s.alt||undefined};
  const o={t:s.t, n:s.n, d:s.d, k:s.k, s:s.s||"", steps:s.steps||[]};
  if(s.zwo) o.zwo=s.zwo; if(s.brick) o.brick=s.brick; if(s.alt) o.alt=s.alt; if(s.outdoor) o.outdoor=true;
  const tips=(s.tips||[]).filter(t=>!isCadRun(t) && t!==CADBIKE); if(tips.length) o.tips=tips;
  return o;
}
function normSession(x){
  if(!x || typeof x!=="object" || !TYPES.includes(x.t)) return null;
  if(x.t==="rest") return descanso(strv(x.s,300)||undefined);
  if(x.t==="str") return cadera(!!x.light);
  if(x.t==="foot") return futbol(x.rol==="portero"?"portero":"jugador",{alt:strv(x.alt,300)||undefined});
  const s={t:x.t, n:strv(x.n,90)||SPORTNAME[x.t], d:numv(x.d,10,360,45), k:KS.includes(x.k)?x.k:"suave", s:strv(x.s,500)};
  s.steps=(Array.isArray(x.steps)?x.steps:[]).filter(a=>Array.isArray(a)&&a.length>=2).slice(0,8).map(a=>[strv(String(a[0]),30),strv(String(a[1]),240)]);
  s.tips=(Array.isArray(x.tips)?x.tips:[]).slice(0,4).map(v=>strv(v,240)).filter(Boolean);
  if(strv(x.alt,300)) s.alt=strv(x.alt,300);
  if((x.t==="bike"||x.t==="test") && BIKE[x.zwo]) s.zwo=x.zwo;
  if(x.t==="bike"){ s.brick=numv(x.brick,0,30,0); s.outdoor=!!x.outdoor; if(!s.steps.length && s.zwo) s.steps=BIKE[s.zwo].steps; s.tips.unshift(CADBIKE); }
  if(x.t==="test") s.go="test";
  if(x.t==="run"){ if(s.k==="calidad"){ s.chk=true; if(!s.tips.includes(COMP)) s.tips.unshift(COMP); } else s.tips.push(CADRUN); }
  return s;
}
function applyOverrides(){

    wk.mod = !!ok;
  });
  rebuildIndex();
}

function chgWeek(){ if(CHG.wi==null){ const i=thisWeekIdx(); CHG.wi = i<0 ? null : i; } return CHG.wi==null ? null : WEEKS[CHG.wi]; }
function chgPrompt(wk, texto){
  const days = wk.days.map((arr,i)=>{ const date=addDays(wk.start,i);
    const st = arr.filter(s=>s.t!=="rest").map(s=>(LOG[s.id]||{}).status).filter(Boolean);
    return {fecha:date, dia:DOW[i], pasado:date<TODAY, hoy:date===TODAY, registrado:st, sesiones:arr.map(serSession)}; });
  const zwo = Object.entries(BIKE).map(([k,b])=>`${k} (${b.d}′${b.blk?", con bloques intensos":", suave"})`).join("; ");
  const nextWk = WEEKS[WEEKS.indexOf(wk)+1];
  return `Eres el entrenador de un triatleta y ajustas su plan de la semana cuando te lo pide. Responde en español de España, tuteando, con frases cortas.

ATLETA
- 20 años, 175 cm, ${KG} kg. Corre desde el verano de 2025; viene del fútbol (portero).
- Carrera: umbral 180 ppm (medido con banda), ~4:39/km. Zonas de pulso: Z1 <153, Z2 153–162, Z3 162–171, Z4 171–180, Z5 >180. VO2max en series de 3′ a 3:55–4:05/km.
- Bici: FTP ${FTP} W${FTP_TEST?` (test de rampa del ${fmtShort(FTP_TEST)})`:" provisional (test de rampa previsto)"}. Rodillo Van Rysel D100 con Zwift.
- Lesión reciente de psoas ilíaco, ya recuperado: evitar picos de carga y sprints en frío.
- Técnica: cadencia baja (~145 pasos/min en rodaje) y zancada larga. Trabaja la cadencia con metrónomo por fases (152 hasta el 15 nov, 156 hasta el 13 dic, luego 160) y hace técnica 2 veces por semana: si mueves un rodaje con técnica, mantén la técnica.
- Quiere un día de descanso completo por semana. Estudiante: exámenes del 27 oct al 6 nov, el 20 nov y el 16 dic.
- Objetivos: 10K el 8 nov (test), 10K el 13 dic (objetivo A), media maratón en primavera y medio Ironman 70.3 a finales de mayo.

REGLAS PARA CAMBIAR LA SEMANA
1. Haz lo que pide. Si choca con estas reglas, haz la alternativa más parecida y explícalo en "cambios".
2. No toques los días pasados ni las sesiones ya registradas como hechas: cópialos tal cual.
3. Un día de descanso completo, salvo que pida otra cosa.
4. Nunca dos sesiones de calidad de carrera en días seguidos. Entre una sesión dura y el test de FTP o una competición, al menos un día suave o de descanso.
5. No subas el volumen total más de un 10 % ni añadas intensidad nueva. Si se pierde una sesión de calidad, muévela si cabe sin romper las reglas; si no, se pierde.
6. Si menciona dolor, lesión, fiebre o estar enfermo: quita la intensidad de los próximos días, deja descanso o muy suave y añade un aviso para que, si sigue, lo consulte con un profesional sanitario.
7. Cambia lo mínimo: los días que no hace falta tocar, cópialos igual.
8. Si no puede correr un día, la alternativa natural es bici en el rodillo (mismo tipo de esfuerzo si encaja, si no suave).

FORMATO DE SESIÓN (el mismo que te paso)
- Descanso: {"t":"rest","s":"texto"} · Rutina de cadera: {"t":"str","light":false} · Fútbol: {"t":"foot","rol":"jugador"|"portero"}
- Resto: {"t":"run"|"bike"|"test"|"race","n":"título corto","d":minutos,"k":"suave"|"calidad"|"test"|"carrera","s":"resumen","steps":[["0–10′","qué hacer"],…],"tips":["consejo"],"alt":"plan B opcional","zwo":"archivo","brick":minutos de carrera tras la bici}
- Archivos de Zwift disponibles para "zwo" (usa solo estos nombres; en bici pon los vatios en "steps"): ${zwo}.

SEMANA ${wk.id} (${fmtShort(wk.start)} – ${fmtShort(addDays(wk.start,6))}) · ${wk.name} · ${wk.role}
Hoy es ${fmtLong(TODAY)}.
${JSON.stringify(days)}
${nextWk?`La semana siguiente empieza con: ${nextWk.days[0].map(s=>s.n).join(", ")}.`:""}

LO QUE PIDE
${texto.slice(0,1500)}

Responde solo con un objeto JSON:
{"resumen":"una o dos frases","cambios":["una frase por cada cambio o aviso"],"dias":[[sesiones del lunes],[martes],[miércoles],[jueves],[viernes],[sábado],[domingo]]}
"dias" tiene siempre 7 elementos y contiene la semana completa, incluidos los días que no cambian.`;
}
async function askChange(){
  if(CHG.busy) return;
  const wk=chgWeek(); if(!wk){ CHG.msg="No hay una semana del plan que cambiar."; fillChange(); return; }
  const texto=CHG.texto.trim();
  if(!texto){ CHG.msg="Escribe primero qué quieres cambiar."; fillChange(); return; }
  if(!db){ CHG.msg="Para guardar cambios tienes que abrir la página con tu cuenta de claude.ai."; fillChange(); return; }
  if(SAMPLE===undefined){ CHG.msg="Conectando con Claude… vuelve a pulsar en unos segundos."; fillChange(); return; }
  if(!SAMPLE){
    await savePet({texto, semana:wk.id, estado:"pendiente", resumen:"Guardada para que Claude la vea en el chat."});
    CHG.msg="Desde esta vista no puedo preguntar a Claude. He guardado la petición: dile en el chat «revisa los cambios de la web» y la aplica."; CHG.texto=""; saveDraft(); fillChange(); return;
  }
  chgCtl=new AbortController(); CHG.busy=true; CHG.err=null; CHG.prop=null; CHG.msg=""; CHG.t0=Date.now(); fillChange();
  chgTick=setInterval(()=>{ const el=document.getElementById("chg-secs"); if(el) el.textContent=Math.round((Date.now()-CHG.t0)/1000); },1000);
  try{
    const r = await SAMPLE.json(chgPrompt(wk, texto), {signal:chgCtl.signal});
    if(!r || typeof r!=="object" || !Array.isArray(r.dias) || r.dias.length!==7) throw {code:"invalid_json"};
    // Los días pasados se quedan como estaban
    const cur = wk.days.map(arr=>arr.map(serSession));
    const dias = r.dias.map((d,i)=> addDays(wk.start,i)<TODAY ? cur[i] : (Array.isArray(d)?d:[]).map(x=>{ const n=normSession(x); return n?serSession(n):null; }).filter(Boolean));
    CHG.prop={wk:wk.id, texto, resumen:strv(r.resumen,400), cambios:(Array.isArray(r.cambios)?r.cambios:[]).slice(0,6).map(v=>strv(v,240)).filter(Boolean), dias};
  }catch(e){
    const code=(e && e.code) || "desconocido";
    if(["sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) SAMPLE=null;
    if(code!=="cancelled") CHG.err=code;
  }finally{ CHG.busy=false; chgCtl=null; clearInterval(chgTick); fillChange(); }
}
async function savePet(p){
  if(!db) return;
  try{ await db.collection("peticiones").add({...p, at:new Date().toISOString()}); }catch(e){}
}
async function applyChange(){
  const p=CHG.prop; if(!p || !db) return;
  const btn=document.getElementById("chg-apply"); if(btn) btn.disabled=true;
  try{
    await db.collection("cambios").doc(p.wk).set({days:p.dias, peticion:p.texto, resumen:p.resumen, cambios:p.cambios, at:new Date().toISOString()});
    await savePet({texto:p.texto, semana:p.wk, estado:"aplicado", resumen:p.resumen});
    CHG.prop=null; CHG.texto=""; saveDraft(); CHG.msg="Cambio aplicado. Ya lo tienes en Hoy y en Semana.";
  }catch(e){ CHG.msg="No se pudo guardar el cambio. Vuelve a probar."; }
  fillChange();
}
async function discardChange(){
  const p=CHG.prop; if(!p) return;
  await savePet({texto:p.texto, semana:p.wk, estado:"descartado", resumen:p.resumen});
  CHG.prop=null; CHG.msg="Propuesta descartada. Puedes escribirla de otra forma y volver a pedirla."; fillChange();
}
async function undoWeek(){
  const wk=chgWeek(); if(!wk || !db || !OVR[wk.id]) return;
  try{ await db.collection("cambios").doc(wk.id).delete(); await savePet({texto:"Deshacer los cambios de la semana", semana:wk.id, estado:"aplicado", resumen:"Vuelve el plan original."}); CHG.msg="Has vuelto al plan original de esta semana."; }
  catch(e){ CHG.msg="No se pudo deshacer. Vuelve a probar."; }
  fillChange();
}
function saveDraft(){ try{ localStorage.setItem(CHG_KEY, CHG.texto); }catch(e){} }
function chgErr(code){
  switch(code){
    case "not_granted": return "Sin permiso para consultar a Claude desde esta página. Puedes darlo en el menú de permisos de la web.";
    case "invalid_json": case "empty_completion": return "La respuesta llegó incompleta. Vuelve a pulsar «Proponer cambio».";
    case "rate_limited": return "Demasiadas consultas seguidas. Prueba de nuevo en un rato.";
    case "session_expired": return "Vuelve a iniciar sesión en claude.ai y prueba otra vez.";
    default: return "No ha salido bien la respuesta. Vuelve a pulsar «Proponer cambio».";
  }
}
const daySum = arr => arr.map(s=>s.t==="rest"?"Descanso":s.t==="str"?"Cadera":s.t==="foot"?"Fútbol ("+(s.rol||(/portero/.test(s.n||"")?"portero":"jugador"))+")":(s.n||SPORTNAME[s.t])).join(" + ");
function propHTML(){
  if(CHG.busy) return `<div class="reco"><p class="thinking">Preparando la propuesta… <span id="chg-secs">${CHG.t0?Math.round((Date.now()-CHG.t0)/1000):0}</span> s. Suele tardar menos de un minuto. La primera vez, claude.ai te pide permiso: acéptalo.</p></div>`;
  let h="";
  if(CHG.err) h+=`<div class="reco ferr"><b>No ha llegado la propuesta.</b> ${esc(chgErr(CHG.err))} <span class="muted mono">(${esc(CHG.err)})</span></div>`;
  if(CHG.msg) h+=`<p class="note">${esc(CHG.msg)}</p>`;
  const p=CHG.prop; if(!p) return h;
  const wk=WEEKS.find(w=>w.id===p.wk); if(!wk) return h;
  const rows=p.dias.map((d,i)=>{ const date=addDays(wk.start,i), before=daySum(wk.days[i].map(serSession)), after=daySum(d);
    if(before===after) return "";
    return `<li><div class="fdate"><span>${DOWS[i]}</span><b>${parse(date).getDate()}</b></div><div style="min-width:0"><div class="old">${esc(before)}</div><div class="new">${esc(after)}${d.filter(s=>s.s).slice(0,1).map(s=>`<span>${esc(s.s)}</span>`).join("")}</div></div></li>`; }).join("");
  h+=`<div class="reco"><div class="fhead"><span class="label">Propuesta</span></div>
   ${p.resumen?`<p class="ftl" style="display:block">${esc(p.resumen)}</p>`:""}
   ${p.cambios.length?`<ul class="av">${p.cambios.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
   ${rows?`<ul class="diff" style="margin-top:10px">${rows}</ul>`:`<p class="fnote">No cambia ningún día.</p>`}
   <div class="actions"><button type="button" class="btn" id="chg-apply" data-chg="apply"${rows?"":" disabled"}>Aplicar cambios</button><button type="button" class="btn ghost" data-chg="discard">Descartar</button></div></div>`;
  return h;
}
function petHTML(){
  if(!PET.length) return `<p class="muted" style="margin-top:6px">Aún no has pedido ningún cambio.</p>`;
  const lab={aplicado:["ok","Aplicado"],descartado:["bad","Descartado"],pendiente:["wait","Pendiente"]};
  return `<ul class="pet">${PET.slice(0,10).map(p=>{ const d=new Date(p.at), [c,t]=lab[p.estado]||["","—"];
    return `<li><div class="pmeta"><span class="pill ${c}">${t}</span><span>${esc(p.semana||"")} · ${isNaN(d)?"":d.getDate()+" "+MON[d.getMonth()]+" "+pad(d.getHours())+":"+pad(d.getMinutes())}</span></div><div>${esc(p.texto||"")}</div>${p.resumen?`<div class="muted" style="font-size:.86rem">${esc(p.resumen)}</div>`:""}</li>`; }).join("")}</ul>`;
}

  const opts = ti<0 ? [] : [[ti,"Esta semana"]].concat(WEEKS[ti+1]?[[ti+1,"La próxima"]]:[]);
  const wk=chgWeek();
  v.innerHTML=`<div class="dayhead"><h2>Cambios</h2><p class="muted">Cuéntame qué quieres cambiar de la semana y te propongo cómo queda. Nada cambia hasta que pulses «Aplicar».</p></div>

   ${wk?`<p class="muted" style="font-size:.88rem;margin-bottom:8px">${fmtShort(wk.start)} – ${fmtShort(addDays(wk.start,6))} · ${esc(wk.name)}${wk.mod?" · ya tiene cambios tuyos":""}</p>`:""}

  </section>
  <section class="card"><h3>Tus peticiones</h3><div id="chg-pet">${petHTML()}</div>
   <p class="fnote">Claude también las lee cuando le escribes en el chat, para tenerlas en cuenta en las semanas siguientes.</p></section>`;
}
function fillChange(){
  if(current!=="cambios") return;
  const ae=document.activeElement;
  if(ae && ae.id==="chg-txt"){ const o=document.getElementById("chg-out"); if(o) o.innerHTML=propHTML(); return; }
  renderCambios();
}
document.addEventListener("input", ev=>{ if(ev.target.hasAttribute && ev.target.hasAttribute("data-chgtxt")){ CHG.texto=ev.target.value; saveDraft(); } });
document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-chg],[data-chgw]"); if(!b) return;
  if(b.dataset.chgw!=null){ CHG.wi=Number(b.dataset.chgw); CHG.prop=null; CHG.msg=""; renderCambios(); return; }
  const a=b.dataset.chg;
  if(a==="ask") askChange(); else if(a==="stop"){ if(chgCtl) chgCtl.abort(); }
  else if(a==="apply") applyChange(); else if(a==="discard") discardChange(); else if(a==="undo") undoWeek();
});
function rerenderPlan(){
  const ae=document.activeElement, typing = ae && ae.dataset && (ae.dataset.f || ae.dataset.food || ae.hasAttribute("data-chgtxt"));
  if(typing) return;
  if(current==="hoy") renderHoy(); else if(current==="semana") renderSemana(); else if(current==="cambios") renderCambios(); else if(current==="comida") fillNext();
}

document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-tab],[data-go],[data-wk],[data-st],[data-timer],[data-cs],[data-ck],[data-rec],[data-gel],[data-tex],[data-food-go],[data-food-stop]");

  if(t.dataset.timer){ startTimer(t); return; }

  if(t.dataset.ck){ CALC.k=t.dataset.ck; pressGroup(t); fillCalc(); return; }
  if(t.dataset.rec){ FP.n=Math.min(10,Math.max(1,FP.n+Number(t.dataset.rec))); fpSave(); fillRec(); return; }
  if(t.dataset.gel){ FP.gel=Number(t.dataset.gel); fpSave(); pressGroup(t); fillComida(); return; }
  if(t.dataset.tex){ FP.tex=t.dataset.tex; fpSave(); pressGroup(t); fillRec(); return; }
  if(t.dataset.st){
    const id=t.closest("[data-id]").dataset.id; const e=LOG[id]=LOG[id]||{};
    e.status = e.status===t.dataset.st ? null : t.dataset.st;

    if(current==="semana") updateWeekStats();
  }
});
function onField(ev){
  const f=ev.target.dataset && ev.target.dataset.f; if(!f) return;
  const id=ev.target.closest("[data-id]").dataset.id; const e=LOG[id]=LOG[id]||{};
  const val=ev.target.value;
  if(f==="note") e.note=val;
  else if(f==="hora") e.hora=val||null;
  else e[f]= val===""? null : Number(val);
  document.querySelectorAll(`[data-load="${id}"]`).forEach(x=>x.textContent=loadTxt(e));
  if(f==="hora") refreshFuel(id);
  if(f==="note"||f==="hora") persistSoon(id); else persist(id);
  if(current==="semana" && f!=="note") updateWeekStats();
}
document.addEventListener("input", onField);
document.addEventListener("input", ev=>{

  if(id==="calc-d"){ CALC.d=Number(ev.target.value); fillCalc(); }
  else if(id==="calc-h"){ CALC.hora=ev.target.value; fillCalc(); }
  else if(id==="pref-bw" || id==="pref-pct"){ const v=Number(ev.target.value), k=id==="pref-bw"?"bw":"pct";

const pressGroup = btn => btn.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===btn));
function syncCards(id){
  const e=LOG[id]||{};
  document.querySelectorAll(`[data-id="${id}"]`).forEach(card=>{
    card.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed", e.status===b.dataset.st));
    const bd=card.querySelector(`[data-badge]`); if(bd) bd.outerHTML=statusBadge(id);
    card.querySelectorAll("[data-f]").forEach(inp=>{ if(document.activeElement===inp) return;
      const f=inp.dataset.f; const val = f==="note" ? (e.note||"") : (e[f]??"");
      if(String(inp.value)!==String(val)) inp.value=val; });
    card.querySelectorAll(`[data-load]`).forEach(x=>x.textContent=loadTxt(e));
  });
  refreshFuel(id);
}

let tmr=null;
function startTimer(btn){
  const box=btn.closest("[data-timer-box]"); const out=box.querySelector("output");
  clearInterval(tmr); let left=Number(btn.dataset.timer); out.textContent=left;
  tmr=setInterval(()=>{ left--; out.textContent=left>0?left:"✓"; if(left<=0){ clearInterval(tmr); beep(); } },1000);
}

(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const d = await window.claude.use("db");
    if(!d) return;
    db=d; setSync("on","Conectando…");
    db.collection("log").onSnapshot(snap=>{
      const seen=new Set();
      snap.docs.forEach(doc=>{ const x=doc.data()||{}; seen.add(doc.id);
        LOG[doc.id]={status:x.status||null, rpe:x.rpe??null, min:x.min??null, note:x.note||"", hora:x.hora||null}; });
      Object.keys(LOG).forEach(k=>{ if(!seen.has(k) && !chains[k]) delete LOG[k]; });
      mode="db"; setSync("on","Sincronizado");
      Object.keys(SESS).forEach(syncCards);
      if(current==="semana") updateWeekStats();
      if(current==="hoy"){ const ae=document.activeElement; if(!ae || !ae.dataset || (!ae.dataset.f && !ae.dataset.food)) renderHoy(); }
    }, err=>{ setSync("local", err && err.code==="revoked" ? "Sin acceso al registro" : "Sin conexión al registro"); });
    db.collection("cambios").onSnapshot(snap=>{
      Object.keys(OVR).forEach(k=>delete OVR[k]);
      snap.docs.forEach(doc=>{ OVR[doc.id]=doc.data()||{}; });
      applyOverrides(); rerenderPlan();
    }, ()=>{});
    db.collection("peticiones").onSnapshot(snap=>{
      PET=snap.docs.map(doc=>({id:doc.id, ...(doc.data()||{})})).sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
      const el=document.getElementById("chg-pet"); if(el) el.innerHTML=petHTML();
    }, ()=>{});
    db.collection("comida").doc(TODAY).onSnapshot(snap=>{
      if(!snap.exists) return; const x=snap.data()||{};
      if(!foodRev){ FOOD.comido=x.comido||""; FOOD.plan=x.plan||""; }   // no pisar lo que se está escribiendo
      if(!FOOD.busy){ FOOD.reco=x.reco||null; FOOD.at=x.at||null; FOOD.err=x.error||null; }
      refreshFoodCard();
    }, ()=>{});
    db.collection("forma").orderBy("fecha","desc").limit(1).onSnapshot(snap=>{
      const d=snap.docs[0]; FORMA = d ? (d.data()||null) : null;
      refreshFormaCard();
    }, ()=>{});
    db.collection("ajustes").doc("habitos").onSnapshot(snap=>{
      if(!snap.exists || habRev) return; const x=snap.data()||{};
      ["des","lj","v","s","d","cena","otros"].forEach(k=>{ if(typeof x[k]==="string") HAB[k]=x[k]; });
      try{ localStorage.setItem(HAB_KEY, JSON.stringify(HAB)); }catch(e){}
      habChanged(false);
    }, ()=>{});
  }catch(e){ /* sigue en modo navegador */ }
})();
(async ()=>{
  try{ SAMPLE = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ SAMPLE=null; }
  refreshFoodCard();
})();
})();
</script>
